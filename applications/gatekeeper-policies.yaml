apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-policies
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mahdi-Nazari/rke2-gitops.git
    targetRevision: HEAD
    path: gatekeeper/policies

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
