apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mahdi-Nazari/rke2-gitops.git
    targetRevision: main
    path: workloads/redis

  destination:
    server: https://kubernetes.default.svc
    namespace: redis

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
